# tmux.conf for servers
# No dependencies. Mostly tmux defaults.
# Copy this file to ~/.tmux.conf on the server.

# 256 colours and true colour. Keeps the look right inside another tmux.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Prefix stays C-b, the tmux default. The local tmux uses C-a, so the two
# do not clash when one tmux runs inside the other.
set -g prefix C-b
bind C-b send-prefix

# More scrollback.
set -g history-limit 50000

# Vi keys in copy mode.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Mouse, focus events and clipboard. These help over SSH and when nested.
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on

# Reload this file with prefix + r.
bind r source-file ~/.tmux.conf \; display "Reloaded"
